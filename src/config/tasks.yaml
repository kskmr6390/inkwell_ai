plan_task:
  description: >
    Analyze the topic and create a high-impact content plan. Include SEO-optimized structure, tone, data visuals, and citations.
  expected_output: >
    - Blog Title
    - One-sentence Meta Description
    - Suggested Tags
    - Thesis/Angle
    - Recommended Tone
    - Section-wise H2/H3 outline with notes per section
    - Placeholder blocks (e.g., [TABLE: AI tools], [QUOTE: expert])
    - Suggested CTAs
    - Source links for references
  agent: planner
  expected_output_file: blog_plan.md

write_task:
  description: >
    Write a full-length markdown blog post from the planner’s outline. Include structure, references, and placeholder visuals.
  expected_output: >
    A complete markdown blog with:
    - Engaging opening hook (stat/quote/example)
    - Well-structured sections with '##' and '###' headers
    - Real data, examples, citations, and quotes
    - Embedded placeholders ([TABLE:], [QUOTE:], [CHART:])
    - Links to studies, tools, or datasets
    - Closing summary and CTA
  agent: writer
  expected_output_file: blog_post.md

edit_task:
  description: >
    Review the draft blog, improve grammar and flow, verify citations, finalize markdown, and enhance readability.
  expected_output: >
    A refined, publication-ready markdown post:
    - Clean grammar, formatting, and sentence structure
    - Consistent tone and logical section flow
    - Tables and quotes embedded in proper markdown
    - Short paragraphs, nested bullets, quote blocks
    - Ready for Dev.to/Markdown publishing
  agent: editor
  expected_output_file: blog_post_final.md

post_to_dev_task:
  description: >
    Publish the final markdown blog to Dev.to. Validate rendering, attach metadata, and return confirmation.
  expected_output: >
    A response markdown file with:
    - Publication status (success/failure)
    - Final post title, tags, and meta description
    - Dev.to blog URL
    - Any errors or warnings from the API
  agent: dev_poster
  expected_output_file: dev_post_result.md

