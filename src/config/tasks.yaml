post_to_twitter_task:
  description: >
    Extract the Dev.to article URL from the previous task result and post an engaging tweet to promote the article on Twitter.
  expected_output: >
    A response markdown file with:
    - Tweet posting status (success/failure)
    - The actual tweet content that was posted
    - Dev.to URL that was included in the tweet
    - Character count and hashtags used
    - Any errors or warnings from the Twitter API
  agent: twitter_poster
  expected_output_file: twitter_post_result.md
